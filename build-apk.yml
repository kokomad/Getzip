name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: "Zip to GitHub"
      APP_ID: "com.khader.getzip"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p /tmp/www
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='android' ./ /tmp/www/
          if [ ! -f /tmp/www/index.html ]; then
            f=$(ls /tmp/www/*.html | head -n1)
            mv "$f" /tmp/www/index.html
          fi
          mkdir -p www && cp -r /tmp/www/. www/
      - name: Create Capacitor Android project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
